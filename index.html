<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stempeluhr">
<title>Stempeluhr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--txt:#f3ede7;--mut:rgba(243,237,231,.58);--card:rgba(10,7,5,.5);--line:rgba(255,255,255,.08);--green:#8cc63f;--red:#e8667e;--blue:#3b8dff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#140d09;color:var(--txt);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 45% at 65% 5%,#6b3d1c 0,rgba(107,61,28,0) 70%),radial-gradient(70% 40% at 5% 45%,#3d2615 0,rgba(61,38,21,0) 70%),radial-gradient(80% 45% at 95% 78%,#40230f 0,rgba(64,35,15,0) 70%),#140d09}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 112px);max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1{font-size:30px;font-weight:600;margin:0}
h2{font-size:30px;margin:8px 0 14px}
.muted{color:var(--mut)}.small{font-size:14px}.center{text-align:center}
.green{color:var(--green)}.red{color:var(--red)}
.clock{font-weight:200;font-size:min(21vw,112px);text-align:center;color:#ddd6d0;margin:10vh 0 7vh;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border-radius:28px;padding:20px}
.today-top{display:flex;gap:18px;align-items:flex-start}
.pct{font-size:44px;font-weight:300;line-height:1;white-space:nowrap}
.barwrap{flex:1;min-width:0}
.bar{height:44px;border-radius:22px;background:rgba(0,0,0,.55);overflow:hidden}
.fill{height:100%;width:0;border-radius:22px;background:linear-gradient(90deg,#7cb518,#3d7a0b);transition:width .4s}
.barlabels{display:flex;justify-content:space-between;margin-top:8px;color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.tile{background:rgba(0,0,0,.45);border-radius:16px;padding:12px 4px;text-align:center;display:flex;flex-direction:column}
.tile b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--mut)}
.sessions{margin-top:16px;color:var(--mut);font-size:15px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 18px}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:17px}
.pill svg{width:22px;height:22px;flex:none}
.pill.sm{padding:9px 18px;font-size:16px}
.pill.wide{width:100%;margin:12px 0}
.pill.red{color:var(--red)}.pill.green{color:var(--green)}
.big{width:100%;height:64px;border-radius:32px;font-size:22px;color:#fff;background:linear-gradient(90deg,#7cb518,#3c7a0a);margin-top:8px}
.big.stop{background:linear-gradient(90deg,#d8465f,#8d1f34)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(calc(100% - 24px),540px);display:flex;padding:6px;border-radius:36px;background:rgba(72,62,54,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:30px;font-size:12px;color:#eee}
.tabs svg{width:26px;height:26px}
.tabs button.on{background:rgba(25,20,16,.7);color:var(--blue)}
.whead{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.ring{width:76px;height:76px;flex:none}
.wtitle{flex:1;min-width:0;white-space:nowrap}.wtitle h1{font-size:24px}.wtitle div{font-size:14px}
.wsum{text-align:right;white-space:nowrap}.wsum b{font-size:18px;font-weight:500}
.navrow{display:flex;gap:8px;justify-content:space-between;margin-bottom:14px}
.navrow .pill{flex:1}
.day{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:16px 18px;margin-bottom:12px;border:1px solid transparent}
.day.is-today{border-color:rgba(255,255,255,.22)}
.day.off{opacity:.55}
.dot{width:34px;height:34px;border-radius:50%;border:4px solid rgba(0,0,0,.45);flex:none}
.dot.ok{border-color:var(--green)}.dot.miss{border-color:var(--red)}.dot.abs{border-color:var(--blue)}
.dot.today{background:#5a1f22}
.dl{flex:1;min-width:0;display:flex;flex-direction:column}
.dl b{font-size:20px;font-weight:600}
.dr{text-align:right;display:flex;flex-direction:column;white-space:nowrap}
.dr b{font-weight:400;font-size:18px}
.tag{color:var(--blue);font-size:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}
.mhead h1{font-size:34px;font-weight:500}
.nav{font-size:34px;padding:0 12px;color:var(--mut)}
.bars{display:flex;justify-content:space-around;align-items:flex-end;margin-bottom:22px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.btrack{height:180px;width:62%;max-width:64px;display:flex;align-items:flex-end;border-bottom:4px solid rgba(255,255,255,.12);border-radius:4px}
.b{width:100%;background:#d23f5a;border-radius:30px;min-height:0}
.bval{font-size:14px;font-variant-numeric:tabular-nums}
.group{background:var(--card);border-radius:22px;margin:0 0 14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.row:last-child{border-bottom:0}
.row.head{font-weight:600}
.row>span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.label{color:var(--mut);font-weight:600;margin:20px 6px 8px}
.hint{color:var(--mut);font-size:14px;margin:-6px 8px 14px}
input,select{font:inherit;font-size:16px;color:var(--txt);background:rgba(255,255,255,.09);border:0;border-radius:12px;padding:8px 12px;max-width:58%;min-width:0}
input[type=number]{width:90px}
input.full{max-width:none;width:100%;background:none;padding:0}
input.file{max-width:50%;background:none;padding:0;font-size:13px}
.erow input[type=time]{flex:1;max-width:none}
.del{color:var(--red);font-size:15px;padding:6px}
#sheet{position:fixed;inset:0;z-index:10}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:#241a13;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0}
.ot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
.ot{background:var(--card);border-radius:22px;padding:16px 6px;text-align:center;display:flex;flex-direction:column;border:2px solid transparent}
.ot b{font-size:34px;font-weight:400;font-variant-numeric:tabular-nums}
.ot span{font-size:14px;color:var(--mut)}
.ot.red{border-color:#9c1d35;color:var(--txt)}.ot.green{border-color:#4f8a1c;color:var(--txt)}
.round{width:60px;height:60px;border-radius:50%;font-size:26px;color:#fff;background:#c42746;margin-top:8px}
.badge{color:var(--blue);margin:-6px 0 6px}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="start" onclick="go('start')"><svg viewBox="0 0 24 24"><path d="M6 3.5l14 8.5-14 8.5z" fill="currentColor"/></svg>Start</button>
  <button data-tab="week" onclick="go('week')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.5M3.5 12h.5M3.5 18h.5"/></svg>Woche</button>
  <button data-tab="month" onclick="go('month')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01" stroke-linecap="round" stroke-width="2.6"/></svg>Monat</button>
  <button data-tab="setup" onclick="go('setup')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5" stroke-width="3.5" stroke-dasharray="3.3 3.37"/><circle cx="12" cy="12" r="5" stroke-width="3"/></svg>Setup</button>
</nav>
<div id="sheet" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="logic.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
