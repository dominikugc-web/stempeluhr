<body>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="start" onclick="go('start')"><svg viewBox="0 0 24 24"><path d="M6 3.5l14 8.5-14 8.5z" fill="currentColor"/></svg>Start</button>
  <button data-tab="week" onclick="go('week')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.5M3.5 12h.5M3.5 18h.5"/></svg>Woche</button>
  <button data-tab="month" onclick="go('month')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01" stroke-linecap="round" stroke-width="2.6"/></svg>Monat</button>
  <button data-tab="stats" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z" fill="currentColor"/></svg>Statistik</button>
  <button data-tab="pay" onclick="go('pay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5M4 10.5h9M4 13.5h9"/></svg>Verdienst</button>
  <button data-tab="team" onclick="go('team')" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17.5 14.6c2.3.3 3.7 2 4 4.4"/></svg>Team</button>
  <button data-tab="setup" onclick="go('setup')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5" stroke-width="3.5" stroke-dasharray="3.3 3.37"/><circle cx="12" cy="12" r="5" stroke-width="3"/></svg>Setup</button>
</nav>
<div id="sheet" hidden></div>
